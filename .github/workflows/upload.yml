name: Custom Rom Builder Samsung Galaxy A11/M11

on:
  workflow_dispatch:
    inputs:
      GSI:
        description: 'direct link for Gsi image'
        required: true
        default: 'https://sourceforge.net/projects/nippongsi/files/MIUI%20-%20MIUI-NoobPerfPlusEditionSpeciallyForPUBG-11.0%20-%20D7DYXKS1CM/MIUI-NoobPerfPlusEditionSpeciallyForPUBG-11.0-AB-11-20221207-NipponGSI.img.gz/download'
      ARCH:
        description: 'ARM64 or ARM32?'
        required: true
        default: '64'
      NAME:
        description: 'Rom Name'
        required: true
        default: 'MIUI_11_A11_M11_ARM64'

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt-get install -y jq rsync
        sudo apt install -y zip xz-utils unzip p7zip-full wget

    - name: Preparing Files
      env:
        GIT_TERMINAL_PROMPT: 0
      run: |
        for REPO in \
          ahmed-ismail1/Custom-Rom-Builder-For-Samsung-Galaxy-A11-M11 \
          chenjohnliu/Custom-Rom-Builder-For-Samsung-Galaxy-SDM439-SDM450 \
          SamsungSDM439/Custom-Rom-Builder-For-Samsung-Galaxy-A01-M01 \
          smiley9000/Custom-Rom-Builder-For-Samsung-Galaxy-A11-M11
        do
          echo "Trying $REPO"
          if git clone --depth 1 "https://github.com/$REPO" builder; then
            echo "Cloned: $REPO"
            break
          fi
          rm -rf builder
        done
        [ -d builder ] || { echo "No builder repo could be cloned"; exit 1; }
        rsync -a --exclude .git builder/ ./
        ls -la
        ls -la bin || true

    - name: Downloading your GSI
      env:
        GSI_URL: ${{ github.event.inputs.GSI }}
      run: |
        mkdir -p temp
        wget --trust-server-names -P ./temp "$GSI_URL"
        ls -la ./temp
        chmod 755 *
        chmod 755 ./bin/*

    - name: Building
      run: |
        ./arm${{ github.event.inputs.ARCH }}_git

    - name: Uploading The Zip to Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.NAME }}
        path: ./zip/Custom_Rom_SDM450.zip
